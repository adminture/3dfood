<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to open AR Menu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{
    margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#0f0f12; color:#f4f1ea; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center; padding:20px;
  }
  h1{ font-size:1.3rem; margin-bottom:6px; }
  p{ color:#9a968f; font-size:0.85rem; margin-bottom:24px; max-width:320px; }
  #qrcode{ background:#fff; padding:16px; border-radius:16px; }
  #urlBox{
    margin-top:20px; background:#1f1f26; padding:10px 16px; border-radius:10px;
    font-size:0.8rem; color:#ffb24a; word-break:break-all; max-width:320px;
  }
  .hint{ margin-top:18px; font-size:0.75rem; color:#666; max-width:320px; }
</style>
</head>
<body>
  <h1>🍕 Scan to open the AR menu</h1>
  <p>Point your phone's camera at this code (phone must be on the same WiFi as this PC).</p>
  <div id="qrcode"></div>
  <div id="urlBox"></div>
  <div class="hint">If scanning fails, type the URL above manually into your phone's browser instead.</div>

<script>
  // Builds the menu URL using THIS machine's address so it works
  // whether you're running locally (LAN IP) or later on GitHub Pages.
  const menuUrl = window.location.origin + window.location.pathname.replace('qr.html','menu.html');
  document.getElementById('urlBox').textContent = menuUrl;
  new QRCode(document.getElementById('qrcode'), {
    text: menuUrl,
    width: 220,
    height: 220
  });
</script>
</body>
</html>
